name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: techdigest
          POSTGRES_PASSWORD: techdigest
          POSTGRES_DB: techdigest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U techdigest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://techdigest:techdigest@localhost:5432/techdigest_test
      TEST_DATABASE_URL: postgresql://techdigest:techdigest@localhost:5432/techdigest_test
      SECRET_KEY: ci-secret-key
      JWT_SECRET_KEY: ci-jwt-secret-key

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Apply migrations
        run: flask db upgrade

      - name: Run tests
        run: pytest
