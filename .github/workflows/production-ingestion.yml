name: Production Ingestion

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ingestion + summarization pipeline
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          AI_PROVIDER: openrouter
          OPENROUTER_API_KEY: ${{ secrets.PROD_OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: nvidia/nemotron-nano-9b-v2:free
          SECRET_KEY: ${{ secrets.PROD_SECRET_KEY }}
          JWT_SECRET_KEY: ${{ secrets.PROD_JWT_SECRET_KEY }}
        run: python -m scripts.run_production_pipeline
